<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Stays Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --forest:#14532D; --forest-deep:#0F3F22; --forest-ink:#0B2E19;
  --sage:#8FB3A0; --sage-light:#D6E5DC; --sage-pale:#EEF4F0;
  --cream:#FFFFFF; --cream-deep:#E7EDE9; --paper:#F4F7F4;
  --charcoal:#2A3430; --ink:#16201B; --muted:#5B6863; --line:#D9E0DB;
  --clay:#D9A441; --clay-deep:#B8862A; --ochre:#D9A441; --water:#2F5F8A; --water-deep:#23486B; --gold-light:#F2C766;
  --good:#1F7A48; --warn:#A8730F; --bad:#B23A2C;
  --radius:10px; --radius-lg:18px;
  --shadow:0 1px 2px rgba(22,32,27,.06), 0 8px 24px rgba(22,32,27,.08);
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'Public Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#E3E8E4;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.phone{background:#1B2420}
#app{container-type:inline-size;container-name:app;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;background:var(--cream);position:relative;display:flex;flex-direction:column}
body.phone #app{width:390px;height:800px;margin:28px auto;border:10px solid #151616;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:var(--forest);text-decoration-thickness:1px;text-underline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;color:var(--forest-ink)}
h1{font-size:clamp(2rem,5cqw,3.4rem)}
h2{font-size:clamp(1.6rem,3.2cqw,2.3rem)}
h3{font-size:1.25rem}
p{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--water)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.section{padding:56px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.section-head p{max-width:56ch;color:var(--muted);margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.notice{background:#FFF6DF;border:1px solid #E8D39A;color:#5B4510;border-radius:10px;padding:10px 14px;font-size:.9rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--radius);border:2px solid transparent;font-weight:700;font-size:1rem;text-decoration:none;white-space:nowrap;transition:background .15s,transform .05s;color:inherit;background:transparent}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--clay);color:var(--ink)}
.btn-primary:hover{background:var(--clay-deep)}
.btn-forest{background:var(--forest);color:#fff}
.btn-forest:hover{background:var(--forest-deep)}
.btn-outline{background:transparent;border-color:var(--forest);color:var(--forest)}
.btn-outline:hover{background:var(--sage-pale)}
.btn-light{background:#fff;color:var(--forest);border-color:var(--line)}
.btn-light:hover{border-color:var(--forest)}
.btn-sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;min-height:66px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--forest-ink);font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--forest);display:grid;place-items:center;color:#fff}
.nav-links{display:flex;gap:4px;margin-left:8px}
.nav-links a{padding:10px 12px;border-radius:8px;text-decoration:none;font-weight:600;color:var(--charcoal)}
.nav-links a:hover,.nav-links a.active{background:var(--sage-pale);color:var(--forest-ink)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.trip-pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--forest);color:#fff;font-weight:700;text-decoration:none}
.trip-pill .count{background:var(--ochre);color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;padding:0 6px}
.nav-toggle{display:none;width:48px;height:48px;border:0;background:transparent;color:var(--forest-ink);border-radius:8px}
.nav-drawer{display:none;width:100%}

/* hero */
.hero{position:relative;background:var(--forest-ink);color:#fff;overflow:hidden}
.hero-art{position:absolute;inset:0;background-size:cover;background-position:center bottom}
.hero-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,46,25,.3) 0%,rgba(11,46,25,.1) 40%,rgba(11,46,25,.82) 100%)}
.hero-in{position:relative;padding:64px 0 48px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:end}
.hero h1{color:#fff;font-size:clamp(2.3rem,5.4cqw,4rem);font-weight:500;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--gold-light)}
.hero-lede{margin-top:16px;font-size:1.125rem;max-width:44ch;color:rgba(255,255,255,.9)}
.hero-stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.hero-stats div{border-left:2px solid var(--ochre);padding-left:12px}
.hero-stats b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1}
.hero-stats span{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}

/* planner form */
.planner{background:var(--paper);color:var(--ink);border-radius:var(--radius-lg);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.planner h2{font-size:1.4rem;margin-bottom:4px}
.planner .sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field select,.field input,.field textarea{min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:var(--radius);background:#fff;width:100%}
.field textarea{padding:10px 12px;min-height:100px}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--forest);outline:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .span2{grid-column:1/-1}
.seg{display:flex;gap:6px;background:var(--cream-deep);padding:4px;border-radius:var(--radius)}
.seg button,.seg a{flex:1;min-height:40px;border:0;border-radius:7px;background:transparent;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.seg button.on,.seg a.on{background:#fff;color:var(--forest-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mpd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mpd button{min-height:44px;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:700;color:var(--charcoal)}
.mpd button.on{border-color:var(--forest);background:var(--sage-pale);color:var(--forest-ink)}
.planner .btn-primary{margin-top:16px;min-height:56px;font-size:1.1rem}

/* trail ribbon (progress indicator) */
.ribbon{position:relative;padding:26px 8px 34px}
.ribbon-line{height:6px;border-radius:3px;background:var(--sage-light);position:relative}
.ribbon-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--forest)}
.ribbon-stop{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--forest)}
.ribbon-stop.night{background:var(--ochre);border-color:var(--forest-ink)}
.ribbon-walker{position:absolute;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:var(--water);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;transition:left .6s ease;z-index:2}
.ribbon-label{position:absolute;top:22px;transform:translateX(-50%);font-size:.72rem;font-weight:700;color:var(--charcoal);white-space:nowrap}
.ribbon-mile{position:absolute;bottom:100%;margin-bottom:8px;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.card-img{aspect-ratio:16/10;background:var(--sage-light);background-size:cover;background-position:center;position:relative}
.card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.15rem}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--sage-pale);color:var(--forest-ink)}
.tag.ochre{background:#FBEFD2;color:#6B4E0F}
.tag.clay{background:#E3EDF5;color:var(--water-deep)}
.tag.white{background:rgba(255,255,255,.92);color:var(--forest-ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.card-img .tags{position:absolute;left:10px;top:10px}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.875rem}
.meta b{color:var(--ink)}
.rate{font-family:var(--display);font-size:1.4rem;font-weight:600;color:var(--forest-ink)}
.rate small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:500}
.avail{font-size:.85rem;font-weight:700}
.avail.ok{color:var(--good)}.avail.low{color:var(--warn)}.avail.none{color:var(--bad)}
.card-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.card-actions .btn{flex:1}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.steps::before{content:"";position:absolute;left:10%;right:10%;top:26px;height:3px;background:var(--sage-light);border-radius:2px}
.step{position:relative;padding:0 16px;text-align:center}
.step .n{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.25rem;border:4px solid var(--paper);position:relative}
.step h3{font-size:1.05rem;margin-bottom:6px}
.step p{font-size:.9rem;color:var(--muted)}

/* map */
.map-wrap{position:relative;background:#EEF3EF;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.map-wrap svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
.map-wrap svg.dragging{cursor:grabbing}
.map-tall{height:620px}
.map-preview{height:400px}
.map-ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.map-ctl button{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:800;font-size:1.1rem;color:var(--forest-ink);box-shadow:var(--shadow)}
.map-legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:.8rem;z-index:3;max-height:calc(100% - 24px);overflow:auto}
.map-legend label{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:26px}
.map-legend input{width:18px;height:18px;accent-color:var(--forest)}
.legend-btn{position:absolute;left:12px;bottom:12px;z-index:3;display:none}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.map-card{position:absolute;right:12px;bottom:12px;width:340px;max-width:calc(100% - 24px);background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:4;overflow:hidden}
.map-card .card-img{aspect-ratio:16/7}
.map-card .close{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.95);font-size:1.2rem;z-index:2;line-height:1}
.map-card .card-body{padding:14px}
.map-tip{position:absolute;pointer-events:none;background:var(--charcoal);color:#fff;font-size:.8rem;padding:4px 8px;border-radius:6px;transform:translate(-50%,-150%);white-space:nowrap;z-index:5;display:none}
.pin{cursor:pointer}
.pin .bg{stroke:#fff;stroke-width:2}
.pin:hover .bg{stroke-width:3.5}
.pin.sel .bg{stroke:var(--ochre);stroke-width:4}
.town-label{font-family:var(--body);font-size:11px;font-weight:700;fill:#223029;pointer-events:none}
.mile-label{font-family:var(--body);font-size:9px;fill:#5B6863;pointer-events:none}
.map-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:600;color:var(--charcoal)}
.chip.on{border-color:var(--forest);background:var(--sage-pale);color:var(--forest-ink)}

/* planner page */
.plan-layout{display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start}
.plan-controls{position:sticky;top:82px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.plan-controls h3{font-size:1.1rem}
.day{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px}
.day-head{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 20px;background:var(--sage-pale);border-bottom:1px solid var(--line)}
.day-n{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--forest);line-height:1}
.day-n small{display:block;font-family:var(--body);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.day-route{font-weight:700;font-size:1.1rem}
.day-route .arrow{color:var(--water);margin:0 6px}
.day-stats{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.day-stats b{color:var(--ink)}
.day-body{padding:16px 20px}
.day-body h4{font-family:var(--body);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.stay-row{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.stay-row.selected{border-color:var(--forest);background:var(--sage-pale)}
.stay-row .thumb{aspect-ratio:4/3;border-radius:8px;background-size:cover;background-position:center}
.stay-row h3{font-size:1.05rem}
.stay-row .meta{margin-top:4px}
.stay-row .sel{display:flex;flex-direction:column;align-items:end;gap:8px}
.trip-summary{background:var(--forest-ink);color:#fff;border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:12px}
.trip-summary h3{color:#fff}
.trip-summary .line{display:flex;justify-content:space-between;gap:12px;font-size:.95rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.trip-summary .line span:last-child{white-space:nowrap}
.trip-summary .total{font-family:var(--display);font-size:1.6rem;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.toggle{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--forest);flex:none}
.toggle b{display:block}
.toggle span{font-size:.85rem;color:var(--muted)}
.trip-summary .toggle{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.trip-summary .toggle span{color:rgba(255,255,255,.7)}
.empty{padding:40px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:var(--radius-lg);color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* directory */
.dir-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.filters{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:16px;position:sticky;top:82px}
.filters h3{font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.filters .group{display:flex;flex-direction:column;gap:4px}
.filters .group b{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.check{display:flex;align-items:center;gap:10px;min-height:36px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--forest)}
.range{width:100%;accent-color:var(--forest)}
.dir-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.filters-toggle{display:none}
.list-row{display:grid;grid-template-columns:260px 1fr;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:14px}
.list-row .card-img{aspect-ratio:auto;min-height:200px}
.list-row .card-body{padding:18px 20px}
.amen{display:flex;gap:6px;flex-wrap:wrap}
.amen span{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--charcoal);background:var(--paper);padding:3px 8px;border-radius:6px}
.amen .icon{width:14px;height:14px}

/* property */
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:220px 220px;gap:8px;border-radius:var(--radius-lg);overflow:hidden}
.gallery div{background-size:cover;background-position:center}
.gallery div:first-child{grid-row:1/3}
.prop-layout{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:start;margin-top:28px}
.prop-main h2{font-size:1.4rem;margin:30px 0 10px}
.prop-main>h2:first-child{margin-top:0}
.prop-main p{max-width:68ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.fact{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact b{display:block;font-family:var(--display);font-size:1.25rem;color:var(--forest-ink)}
.fact span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:10px}
.room{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;align-items:center}
.room b{display:block}
.room .muted{font-size:.85rem}
.book-box{position:sticky;top:82px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.book-box .rate{font-size:1.8rem}
.review{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.review b{display:block;font-size:.85rem;color:var(--muted);margin-top:6px}
.stars{color:var(--ochre);letter-spacing:1px}
.dl{display:grid;grid-template-columns:170px 1fr;gap:8px 16px;font-size:.95rem}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.crumb a{color:var(--muted)}

/* checkout */
.co-layout{display:grid;grid-template-columns:1fr 400px;gap:32px;align-items:start}
.co-stay{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.co-stay .thumb{aspect-ratio:1;border-radius:8px;background-size:cover}
.co-stay .date{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--water);font-weight:700}
.co-stay .price{font-weight:700;text-align:right}
.co-stay .price small{display:block;font-weight:500;color:var(--muted)}
.co-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;gap:14px}
.co-box .line{display:flex;justify-content:space-between;font-size:.95rem;gap:12px}
.co-box .total{display:flex;justify-content:space-between;font-family:var(--display);font-size:1.6rem;font-weight:600;border-top:2px solid var(--forest);padding-top:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .span2{grid-column:1/-1}
.pay{background:var(--sage-pale);border:1px dashed var(--sage);border-radius:12px;padding:14px;font-size:.9rem;color:var(--forest-ink)}
.sync{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--good);font-weight:600}
.sync .live{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(47,122,78,.2);flex:none}
.confirm-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px;align-items:center}
.confirm-card code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--cream-deep);padding:2px 6px;border-radius:4px}
.co-section{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;margin-bottom:18px}
.co-section h2{font-size:1.3rem;margin-bottom:14px}

/* trail mode */
.tm-hero{background:var(--charcoal);color:#fff;border-radius:var(--radius-lg);padding:32px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.tm-hero h2{color:#fff}
.tm-hero p{color:rgba(255,255,255,.8)}
.tm-hero ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.tm-hero li{display:flex;gap:10px;align-items:center}
.tm-hero li .icon{color:var(--ochre)}
.tm-panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.progress{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ochre);width:0;transition:width .35s}
.offline{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;font-size:1.05rem}
.offline .oh{background:var(--forest-ink);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.offline .on{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:14px}
.offline .on .d{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--forest);min-width:64px}
.offline .on b{font-size:1.15rem}
.offline .on a{font-weight:700;font-size:1.15rem}
.offline .on .dir{margin-top:6px;color:var(--charcoal)}
.offline .em{padding:16px 18px;background:#FBEBE7}
.offline .em b{color:var(--bad)}
.offline .em div{display:flex;justify-content:space-between;padding:4px 0;gap:12px}

/* join */
.join-hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.benefit{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.benefit .icon{color:var(--water);width:28px;height:28px;margin-bottom:10px}
.benefit h3{font-size:1.05rem;margin-bottom:6px}
.benefit p{font-size:.9rem;color:var(--muted)}
.sync-diagram{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.sync-diagram .node{background:var(--sage-pale);border-radius:10px;padding:12px;text-align:center;font-weight:700;font-size:.9rem}
.sync-diagram .node span{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.sync-diagram .arr{color:var(--water);font-weight:800}

/* explore */
.sections{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sec-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.sec-card .miles{font-family:var(--display);font-size:1.3rem;color:var(--forest)}
.surface{display:flex;gap:3px;height:8px;border-radius:4px;overflow:hidden}
.surface i{display:block}
.surface .paved{background:var(--forest)}.surface .dust{background:var(--ochre)}.surface .road{background:var(--clay-deep)}
.surface-key{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.surface-key i{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle;margin-right:4px}
.trips{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.trip-card{border-radius:14px;overflow:hidden;color:#fff;position:relative;min-height:250px;display:flex;flex-direction:column;justify-content:end;padding:18px;background-size:cover;text-decoration:none;border:0;text-align:left;cursor:pointer}
.trip-card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(11,46,25,.92))}
.trip-card>*{position:relative}
.trip-card h3{color:#fff;font-size:1.3rem}
.trip-card p{font-size:.85rem;color:rgba(255,255,255,.88);margin-top:4px}
.trip-card .tag{margin-bottom:8px;align-self:flex-start}
.baggage{background:var(--forest);color:#fff;border-radius:var(--radius-lg);padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.baggage h2{color:#fff}
.baggage p{color:rgba(255,255,255,.88);margin-top:10px;max-width:48ch}
.baggage blockquote{margin:16px 0 0;font-family:var(--display);font-style:italic;font-size:1.35rem;color:var(--gold-light)}
.bag-demo{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.bag-demo .line{display:flex;justify-content:space-between;font-size:.95rem}
.bag-demo .line.total{border-top:1px solid rgba(255,255,255,.25);padding-top:8px;font-weight:700}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.resource{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.resource b{color:var(--forest-ink)}
.resource span{font-size:.85rem;color:var(--muted)}
.cta-band{background:var(--sage-pale);border-radius:var(--radius-lg);padding:36px 40px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.cta-band p{color:var(--muted);margin-top:6px;max-width:56ch}
footer{background:var(--forest-ink);color:rgba(255,255,255,.8);padding:44px 0 40px;margin-top:auto}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
footer h4{color:#fff;font-family:var(--body);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
footer a{color:rgba(255,255,255,.8);text-decoration:none;display:block;padding:4px 0}
footer .fine{margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.15);font-size:.8rem;color:rgba(255,255,255,.55)}

/* sticky mobile bar + toasts */
.toast-host{position:sticky;bottom:90px;height:0;z-index:60;pointer-events:none}
.toast{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);width:max-content;max-width:calc(100% - 32px);text-align:center;animation:toastin .2s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
.mobile-bar{display:none;position:sticky;bottom:0;z-index:55;background:var(--forest-ink);color:#fff;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.15)}
.mobile-bar-in{display:flex;align-items:center;gap:12px}
.mobile-bar .info b{display:block;font-size:.95rem}
.mobile-bar .info span{font-size:.8rem;color:rgba(255,255,255,.7)}
.mobile-bar .btn{margin-left:auto;min-height:48px}
.view-switch{display:none;position:sticky;top:66px;z-index:45;background:var(--cream);padding:8px 16px;border-bottom:1px solid var(--line)}

/* phone toggle (outside app) */
.phone-toggle{position:fixed;right:18px;bottom:18px;z-index:100;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--charcoal);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.phone-toggle .icon{width:18px;height:18px}

/* narrow container (phone) */
@container app (max-width: 860px){
  .wrap{width:min(1180px,100% - 32px)}
  .section{padding:40px 0}
  .nav-links,.nav-right .trip-pill{display:none}
  .nav-toggle{display:grid;place-items:center;margin-left:auto}
  .nav-drawer{flex-direction:column;padding:4px 0 12px;border-top:1px solid var(--line)}
  .nav-drawer.open{display:flex}
  .nav-drawer a{padding:14px 4px;font-size:1.1rem;font-weight:700;text-decoration:none;color:var(--forest-ink);border-bottom:1px solid var(--line)}
  .hero-in{grid-template-columns:1fr;padding:36px 0 28px;gap:24px}
  .hero h1{font-size:2.2rem}
  .hero-lede{font-size:1rem}
  .hero-stats{gap:18px}
  .planner{padding:18px}
  .mpd button{font-size:.85rem;padding:0 4px}
  .grid-4,.grid-3,.grid-2,.sections,.trips,.resources{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr;gap:22px}
  .steps::before{left:24px;right:auto;top:0;bottom:0;width:3px;height:auto}
  .step{display:grid;grid-template-columns:52px 1fr;gap:14px;text-align:left;padding:0}
  .step .n{margin:0}
  .step h3{margin-top:12px}
  .plan-layout,.dir-layout,.prop-layout,.co-layout,.join-hero,.tm-hero,.baggage{grid-template-columns:1fr}
  .plan-controls,.filters,.book-box{position:static}
  .filters{display:none}.filters.open{display:flex}
  .filters-toggle{display:inline-flex}
  .day-head{grid-template-columns:auto 1fr;padding:14px 16px}
  .day-body{padding:14px 16px}
  .stay-row{grid-template-columns:84px 1fr;gap:10px}
  .stay-row .sel{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .list-row{grid-template-columns:1fr}
  .list-row .card-img{min-height:170px}
  .gallery{grid-template-columns:1fr 1fr;grid-template-rows:200px 110px}
  .gallery div:first-child{grid-row:1;grid-column:1/-1}
  .gallery div:nth-child(n+4){display:none}
  .facts{grid-template-columns:1fr 1fr}
  .dl{grid-template-columns:1fr}
  .map-tall{height:540px}
  .map-preview{height:300px}
  .map-legend{display:none;bottom:64px}
  .map-legend.open{display:grid}
  .legend-btn{display:inline-flex}
  .map-card{left:12px;right:12px;width:auto}
  .form{grid-template-columns:1fr}
  .cta-band{flex-direction:column;align-items:start;padding:28px}
  footer .cols{grid-template-columns:1fr 1fr}
  .mobile-bar{display:block}
  .view-switch{display:block}
  .baggage{padding:24px}
  .tm-hero{padding:22px}
  .sync-diagram{grid-template-columns:1fr}
  .sync-diagram .arr{text-align:center;transform:rotate(90deg)}
}
@container app (max-width: 480px){
  .grid-4,.grid-3,.grid-2,.sections,.trips,.resources{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .hero-stats b{font-size:1.3rem}
  footer .cols{grid-template-columns:1fr}
  .co-stay{grid-template-columns:56px 1fr}
  .co-stay .price{grid-column:2;text-align:left}
}
/* ---- lodging storytelling ---- */
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--sage-pale);color:var(--forest-ink);border:1px solid var(--sage-light);white-space:nowrap}
.badge .icon{width:13px;height:13px}
.badge.fav{background:#FBEFD2;color:#6B4E0F;border-color:#EBD79A}
.from{font-size:.9rem;font-weight:600;color:var(--muted);white-space:nowrap}
.story{font-family:var(--display);font-style:italic;font-size:1.05rem;color:var(--charcoal);line-height:1.4}
.inn-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}

.inn-foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:auto;flex-wrap:wrap}
.tonight{display:grid;grid-template-columns:280px 1fr;background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.tonight.selected{border-color:var(--forest);box-shadow:0 0 0 3px var(--sage-pale)}
.tonight-img{display:block;background-size:cover;background-position:center;min-height:250px}
.tonight-body{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.tonight-body h3{font-size:1.5rem}
.why-mini{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.9rem}

.tonight-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.alts{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}

.stay-row .story{font-size:.95rem}
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.quick .no{color:var(--muted);font-weight:500}

.tour-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.tour-img{display:block;aspect-ratio:16/10;background-size:cover;background-position:center;position:relative}
.tour-stat{position:absolute;left:12px;bottom:12px;background:rgba(11,46,25,.9);color:#fff;padding:6px 12px;border-radius:8px;font-weight:800;font-size:.85rem;letter-spacing:.02em}

.glance{background:var(--sage-pale);border:1px solid var(--sage-light);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

.price-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:sticky;top:82px}

.price-box .line{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);gap:10px}

.dep-row span{font-size:.78rem;color:var(--muted);display:block}

.narr .tonight-line b a{text-decoration:none;color:var(--forest-ink)}

.request h3{color:#fff;font-size:1.5rem}

.tour-layout{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:start;margin-top:24px}

.pkg-banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--sage-pale);border:1px solid var(--sage-light);border-radius:12px;padding:12px 16px;margin:14px 0 6px}

@container app (max-width: 860px){

function viewStays() {

    <div class="group"><b>Max nightly rate · <span class="num">${money(d.maxPrice)}</span></b><input class="range" type="range" min="120" max="350" step="10" value="${d.maxPrice}" data-dir="maxPrice"></div>

  return `<section class="section" style="padding-top:28px"><div class="wrap">

/* ---------- render + router ---------- */
function render(scrollTop) {
  const app = $('#app'); const r = state.route; let view;
  switch (r.name) {
    case 'map': view = viewMap(); break;
    case 'plan': view = viewPlan(); break;
    case 'stays': view = viewStays(); break;
    case 'tours': view = viewTours(); break;
    case 'tour': view = viewTour(r.arg); break;
    case 'stay': view = viewStay(r.arg); break;
    case 'checkout': view = viewCheckout(); break;
    case 'confirmation': view = viewConfirm(); break;
    case 'trail-mode': view = viewTrailMode(); break;
    case 'join': view = viewJoin(); break;
    default: view = viewHome();
  }
  app.innerHTML = shell(view);
  $$('[data-map]', app).forEach(mountMap);
  if (r.name === 'plan' && state.trip) animateRibbon(state.trip);
  if (scrollTop) app.scrollTop = 0;
}
function refreshShell() {
  const app = $('#app');
  const nav = $('.nav', app); if (nav) nav.outerHTML = navHTML().replace(/<div class="view-switch">[\s\S]*$/, '');
  const bar = $('.mobile-bar', app); const fresh = mobileBarHTML(); if (bar) bar.outerHTML = fresh; else if (fresh) app.insertAdjacentHTML('beforeend', fresh);
}
function route() {
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const parts = h.split('/');
  state.route = { name: parts[0], arg: parts[1] };
  state.ui.drawer = false; state.ui.mapSel = null; state.ui.propDate = '';
  if (state.route.name === 'join') state.ui.joined = false;

}
let toastTimer;
function toast(msg) {

}
function readForm() {

}

/* ---------- events ---------- */
document.addEventListener('click', e => {

    case 'drawer': state.ui.drawer = !state.ui.drawer; refreshShell(); break;
    case 'mode': state.form.mode = el.dataset.val; if (!state.form.custom) state.form.mpd = el.dataset.val === 'bike' ? 25 : 15; $$('[data-act="mode"]').forEach(b => b.classList.toggle('on', b === el)); $$('[data-act="mpd"]').forEach(b => b.classList.toggle('on', b.dataset.val === String(state.form.mpd))); break;
    case 'mpd': { const v = el.dataset.val; const custom = $('#f-custom'); if (v === 'custom') { state.form.custom = true; if (custom) { custom.hidden = false; custom.focus(); } } else { state.form.custom = false; state.form.mpd = Number(v); if (custom) { custom.hidden = true; custom.value = v; } } $$('[data-act="mpd"]').forEach(b => b.classList.toggle('on', b === el)); break; }
    case 'book-dep': { const tour = tourById(el.dataset.tour); startTour(tour.id, el.dataset.date, (state.trip && state.trip.travelers) || 2, true); toast(`${tour.name}, departing ${fmt(el.dataset.date, 'long')}. Review your inns, then book.`); location.hash = '#plan'; if (state.route.name === 'plan') render(true); break; }
    case 'select-stay': { const d = state.trip.days[Number(el.dataset.day) - 1]; d.lodgingId = el.dataset.id; save(); render(false); toast(`Night ${d.n}: ${byId(d.lodgingId).name}`); break; }
    case 'clear-stay': { const d = state.trip.days[Number(el.dataset.day) - 1]; d.lodgingId = null; save(); render(false); break; }
    case 'plan-mode': state.trip.mode = el.dataset.val; planTrip(state.trip, true); render(false); break;
    case 'add-trip': addToTrip(el.dataset.id); break;
    case 'dir-view': state.ui.dirView = el.dataset.val; render(false); break;
    case 'dir-cat': state.dir.cat = el.dataset.val; render(false); break;
    case 'alts': { const n = Number(el.dataset.day); if (state.ui.openAlts.has(n)) state.ui.openAlts.delete(n); else state.ui.openAlts.add(n); render(false); const day = $('#day-' + n); if (day) day.scrollIntoView({ block: 'nearest' }); break; }
    case 'filters-toggle': state.ui.filtersOpen = !state.ui.filtersOpen; render(false); break;
    case 'legend-toggle': state.ui.legendOpen = !state.ui.legendOpen; $$('.map-legend').forEach(l => l.classList.toggle('open', state.ui.legendOpen)); break;
    case 'dir-reset': state.dir = { cat: state.dir.cat, section: 'all', date: state.dir.date, maxPrice: 350, maxDist: 2, amen: new Set() }; render(false); break;
    case 'map-card-close': state.ui.mapSel = null; $$('.map-card-slot').forEach(s => { s.innerHTML = ''; }); $$('.pin.sel').forEach(p => p.classList.remove('sel')); break;
    case 'book': {
      const name = ($('#g-name') || {}).value || ''; const email = ($('#g-email') || {}).value || '';
      if (!name.trim() || !/.+@.+\..+/.test(email)) { toast('Add the lead traveler\'s name and a valid email to book.'); ($('#g-name') || {}).focus && $('#g-name').focus(); return; }
      const t = state.trip; const cost = tripCost(t); const id = 'MCT-' + String(hash(name + email + t.date) % 100000).padStart(5, '0');
      state.booking = { id, name, email, total: Math.round(cost.total * 1.1175), bag: t.baggage, tour: cost.tour ? cost.tour.name : null, nights: tripNights(t).map(d => ({ n: d.n, date: d.date, lodgingId: d.lodgingId, conf: byId(d.lodgingId).name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 3) + '-' + String(hash(id + d.lodgingId) % 10000).padStart(4, '0') })) };
      save(); location.hash = '#confirmation'; break;
    }
    case 'new-trip': state.trip = null; state.booking = null; state.offline = null; save(); location.hash = '#home'; toast('Trip cleared. Start a new one any time.'); break;
    case 'tm-download': {
      if (!state.trip) return; state.ui.tmProgress = 0; render(false);
      const tick = () => { state.ui.tmProgress += 20; if (state.ui.tmProgress >= 100) { state.ui.tmProgress = -1; state.offline = { title: tripTitle(state.trip), size: '238 KB', when: new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) }; save(); render(false); toast('Saved. Your trip now opens without a connection.'); } else { render(false); setTimeout(tick, 350); } };
      setTimeout(tick, 350); break;
    }
    case 'print': window.print(); break;
    case 'phone': document.body.classList.toggle('phone'); el.innerHTML = document.body.classList.contains('phone') ? icon('monitor') + ' Desktop view' : icon('phone') + ' Phone view'; $$('[data-map]').forEach(mountMap); break;
  }
});
document.addEventListener('submit', e => {
  const form = e.target; e.preventDefault();
  if (form.dataset.act === 'plan-submit') {
    const f = readForm();
    if (f.start === f.end) { toast('Pick two different points on the trail.'); return; }
    if (!f.date) { toast('Choose a trip start date.'); return; }
    planTrip(Object.assign({}, f)); location.hash = '#plan'; if (state.route.name === 'plan') render(true);
  }
  if (form.dataset.act === 'tour-self') {
    const date = $('#ts-date').value; if (!date) { toast('Choose a start date.'); return; }
    const tour = tourById(form.dataset.tour); startTour(tour.id, date, (state.trip && state.trip.travelers) || 2, false);
    toast(`${tour.name}, self-guided from ${fmt(date, 'long')}. Review your inns, then book.`); location.hash = '#plan'; return;
  }
  if (form.dataset.act === 'request-submit') {
    const email = $('#rq-email').value; if (!/.+@.+\..+/.test(email)) { toast('Add a valid email and we\'ll send the itinerary.'); $('#rq-email').focus(); return; }
    state.ui.requested = email; render(false); return;
  }
  if (form.dataset.act === 'join-submit') {
    if (!$('#j-name').value.trim() || !/.+@.+\..+/.test($('#j-email').value)) { toast('Add your property name and an email address.'); return; }
    state.ui.joined = true; render(false); $('#app').scrollTop = $('#app').scrollHeight - 1200;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.plan && state.trip) {
    const k = el.dataset.plan; const t = state.trip;
    if (k === 'baggage') { t.baggage = el.checked; save(); render(false); return; }
    if (k === 'bikeRental') { t.bikeRental = el.checked; save(); render(false); return; }
    const next = Object.assign({}, t, { [k]: k === 'mpd' || k === 'travelers' ? Number(el.value) : el.value });
    if (next.start === next.end) { toast('Start and end must be different.'); el.value = t[k]; return; }
    if (t.tour && ['start', 'end', 'mpd', 'mode'].includes(k)) { delete next.tour; delete next.guided; toast('Route changed, so this is now a custom trip priced per night.'); }
    planTrip(next, true); render(false); return;
  }
  if (el.dataset.dir) {
    const k = el.dataset.dir;
    if (k === 'amen') { if (el.checked) state.dir[k].add(el.value); else state.dir[k].delete(el.value); }
    else state.dir[k] = el.type === 'range' ? Number(el.value) : el.value;
    render(false); return;
  }
  if (el.hasAttribute('data-propdate')) { state.ui.propDate = el.value; render(false); return; }
  if (el.dataset.mapf && el.closest('.map-toolbar')) {
    if (el.checked) state.ui.mapFilters.add(el.dataset.mapf); else state.ui.mapFilters.delete(el.dataset.mapf);
    el.closest('.chip').classList.toggle('on', el.checked);
    $$('[data-map] svg').forEach(svg => { svg.innerHTML = mapSVGInner(mapOptsFor(svg.parentElement)); });
  }
  if (el.dataset.form === 'mpd') state.form.mpd = Number(el.value) || 15;
});
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { /* keep maps fitted when the frame changes */ $$('[data-map]').forEach(w => { const svg = $('svg', w); if (svg) svg.setAttribute('viewBox', `0 0 ${MAP.W} ${MAP.H}`); mountMap(w); }); });

load();
if (state.trip) state.form = Object.assign({}, state.form, { start: state.trip.start, end: state.trip.end, date: state.trip.date, mpd: state.trip.mpd, mode: state.trip.mode, travelers: state.trip.travelers });
route();
})();

</script>
</body></html>
